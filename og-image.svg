<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Ideafridge Cybersecurity GTM Signal Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080B" />
      <stop offset="100%" stop-color="#030303" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5E6AD2" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="980" cy="120" r="220" fill="#5E6AD2" fill-opacity="0.15" />
  <circle cx="160" cy="540" r="260" fill="#E5A63B" fill-opacity="0.08" />

  <rect x="80" y="90" width="520" height="6" rx="3" fill="url(#accent)" />
  <text x="80" y="190" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="600">Ideafridge</text>
  <text x="80" y="270" fill="#EDEDED" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="500">Cybersecurity GTM Signal Engine</text>
  <text x="80" y="350" fill="#A5B4FC" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500">Turn cybersecurity signals into pipeline.</text>

  <g transform="translate(80, 430)">
    <rect width="420" height="110" rx="14" fill="#0F1117" stroke="#2A2F45" />
    <text x="28" y="48" fill="#A5B4FC" font-family="JetBrains Mono, monospace" font-size="22">INGEST  EXTRACT  DEPLOY</text>
    <text x="28" y="80" fill="#8A8F98" font-family="Inter, Arial, sans-serif" font-size="18">Signal-driven GTM media for cyber teams</text>
  </g>
</svg>
